clusterName: ceph-k8s
talosVersion: v1.13.7
kubernetesVersion: v1.35.0
endpoint: https://control.ceph.impl.nl:6443
allowSchedulingOnControlPlanes: false
additionalMachineCertSans:
  - control.ceph.impl.nl
  - jasmine.odee.net
  - 127.0.0.1
additionalApiServerCertSans:
  - jasmine.odee.net
  - 127.0.0.1
controlPlane:
  nameservers:
    - 1.0.0.1
    - 8.8.4.4
    - 8.8.8.8
worker:
  nameservers:
    - 1.0.0.1
    - 8.8.4.4
    - 8.8.8.8
nodes:
  - hostname: node65
    ipAddress: 192.168.1.65
    controlPlane: true
    installDisk: /dev/mmcblk0
    networkInterfaces:
    - interface: end0
      addresses:
        - 192.168.1.65/24
      routes:
        - network: 0.0.0.0/0
          gateway: 192.168.1.1
          metric: 1024
      mtu: 1500    
